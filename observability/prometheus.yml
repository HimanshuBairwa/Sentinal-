global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Gateway: dependency-free Prometheus text-format metrics on /metrics.
  - job_name: 'gateway'
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:8080']

  # Risk engine: dedicated Prometheus metrics server (:9102).
  - job_name: 'risk-engine'
    static_configs:
      - targets: ['risk-engine:9102']

  # Analytics service: health-derived liveness (fiber JSON health on :8083).
  # Real Go metrics endpoints for auth/analytics/alert are on the roadmap;
  # scraping endpoints that don't exist only creates dead targets.
